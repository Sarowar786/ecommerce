services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: backend-nodejs-prisma-starter-kit-prod:latest
    container_name: app-api-prod
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
